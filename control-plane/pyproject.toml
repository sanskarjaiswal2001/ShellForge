[project]
name = "shellforge-control-plane"
version = "0.1.0"
description = "Enterprise control plane for NVIDIA OpenShell"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # ── Web framework ─────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",

    # ── Validation & settings ─────────────────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # ── Database ──────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # ── Auth / OIDC ───────────────────────────────────────────────────────
    "authlib>=1.3.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.2",

    # ── gRPC (OpenShell) ──────────────────────────────────────────────────
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    "protobuf>=5.28.0",

    # ── Secrets backends ──────────────────────────────────────────────────
    # Each is optional at import time — only the configured backend is loaded.
    "infisicalsdk>=1.0.0",
    "hvac>=2.3.0",                          # HashiCorp Vault
    "boto3>=1.35.0",                        # AWS Secrets Manager

    # ── Observability / OTel ──────────────────────────────────────────────
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "structlog>=24.4.0",

    # ── PDF rendering ─────────────────────────────────────────────────────
    "weasyprint>=63.0",
    "jinja2>=3.1.4",

    # ── Misc ──────────────────────────────────────────────────────────────
    "pyyaml>=6.0.2",
    "click>=8.1.7",
    "rich>=13.9.0",
    "tenacity>=9.0.0",                      # retries with backoff
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "ipython>=8.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ─── Tooling configs ──────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/openshell/proto", "src/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "ASYNC",
    "RUF",
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # assert (used in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["src/openshell/proto", "src/migrations"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib",
]
