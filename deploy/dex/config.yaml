# ═══════════════════════════════════════════════════════════════════════════
# Dex — OIDC Broker Configuration
# ═══════════════════════════════════════════════════════════════════════════
# Local dev: static passwords + static client.
# Enterprise swap: change the `connectors` block below to Okta/Azure AD/etc.
# The ShellForge control plane never sees this config — it only consumes
# the OIDC endpoint that Dex exposes.
#
# Swap examples in comments below — uncomment to switch IdP.
# ═══════════════════════════════════════════════════════════════════════════

issuer: http://dex:5556/dex

storage:
  type: memory                    # swap to: postgres / sqlite3 for persistence

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  responseTypes: ["code"]

# ─── Static OIDC client for ShellForge ─────────────────────────────────────
staticClients:
  - id: shellforge-web
    name: ShellForge Dashboard
    secret: local-dev-only-replace-in-prod
    redirectURIs:
      - http://localhost:3000/auth/callback
      - http://localhost:3000/api/auth/callback/dex
    public: false

  # CLI client (PKCE, no secret)
  - id: shellforge-cli
    name: ShellForge CLI
    public: true
    redirectURIs:
      - http://localhost:8000/auth/cli-callback

# ─── Connectors (the SWAP point) ───────────────────────────────────────────
# DEFAULT: enable password DB for local dev
enablePasswordDB: true

# Static demo users. Tenant claim is injected via groups.
# In prod, REMOVE this entirely — connectors below provide identity.
staticPasswords:
