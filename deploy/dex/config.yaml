  - email: "alice@acme-health.demo"
    # password: demo1234
    hash: "$2a$10$P1pCNiV5O8VtgM6IqGY6OutwfRfQ/PWcMHK.RnoX9KZIzCfDtSCAa"
    username: "alice"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
  - email: "bob@acme-health.demo"
    hash: "$2a$10$P1pCNiV5O8VtgM6IqGY6OutwfRfQ/PWcMHK.RnoX9KZIzCfDtSCAa"
    username: "bob"
    userID: "1aa7f8db-7ad9-4f0f-b3e6-c8a8c4f6d5d2"
  # ── Bolt Bank (PCI) ──
  - email: "carol@bolt-bank.demo"
    hash: "$2a$10$P1pCNiV5O8VtgM6IqGY6OutwfRfQ/PWcMHK.RnoX9KZIzCfDtSCAa"
    username: "carol"
    userID: "2bb8e9ec-8be0-5a10-c4f7-d9b9d5g7e6e3"
