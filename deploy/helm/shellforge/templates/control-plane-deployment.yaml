apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shellforge.controlPlane.fullname" . }}
  labels:
    {{- include "shellforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount.controlPlane }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shellforge
      app.kubernetes.io/component: control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shellforge
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env: {{- include "shellforge.commonEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.resources.controlPlane | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shellforge.controlPlane.fullname" . }}
  labels: {{- include "shellforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.controlPlane.type }}
  ports:
    - name: http
      port: {{ .Values.service.controlPlane.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: shellforge
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
