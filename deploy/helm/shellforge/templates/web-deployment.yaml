apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shellforge.web.fullname" . }}
  labels:
    {{- include "shellforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shellforge
      app.kubernetes.io/component: web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shellforge
        app.kubernetes.io/component: web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "http://{{ include "shellforge.controlPlane.fullname" . }}:{{ .Values.service.controlPlane.port }}"
            - name: NEXT_PUBLIC_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: NEXT_PUBLIC_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shellforge.web.fullname" . }}
  labels: {{- include "shellforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.web.type }}
  ports:
    - name: http
      port: {{ .Values.service.web.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: shellforge
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: {{ .Release.Name }}
