# Secret stubs. In prod, manage these via External Secrets Operator,
# Sealed Secrets, or your secret-injection tool of choice.

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
  labels: {{- include "shellforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.database.url | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-oidc
  labels: {{- include "shellforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ .Values.oidc.clientSecret | quote }}
