# ═══════════════════════════════════════════════════════════════════════════
# ShellForge Policy: PCI-DSS — Payment Card Processing
# ═══════════════════════════════════════════════════════════════════════════
# Compliance regime: PCI DSS v4.0
# Use case:         Payment-processing AI coding agent inside CDE
# Controls:
#   Req 1.3   — Restrict inbound/outbound traffic to/from CDE
#   Req 1.3.2 — Limit outbound traffic from CDE to only what is necessary
#   Req 3.4   — Do not store PAN unprotected
#   Req 4.2.1 — Strong cryptography in transmissions (tls: Auto)
#   Req 6.4   — Address common vulnerabilities (default-deny + Enforce)
#   Req 7.2   — Access by need-to-know (binaries-restricted endpoints)
#   Req 10.2  — Audit logs of all access (enforcement: Enforce)
#
# Author:           ShellForge Compliance Team
# Last reviewed:    2026-05-29
# ═══════════════════════════════════════════════════════════════════════════

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /proc/self
    - /etc
  # Req 3.4: No persistent storage of cardholder data outside CDE-approved paths
  read_write:
    - /sandbox/workspace
    - /tmp
  # No /root, no /home/sandbox

landlock:
  # Req 1.3: Network controls cannot be bypassed by misconfigured landlock
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # Req 4.2.1: Strong cryptography in all transmissions
  # Req 6.4 + 7.2: explicit binaries + explicit paths per endpoint

  payment_processor_api:
    name: "Payment Processor API (CDE)"
    endpoints:
      - host: api.stripe.com
        port: 443
        protocol:
          type: Rest
          tls: Auto                       # Req 4.2.1
          enforcement: Enforce            # Req 10.2
        rules:
          - allow: { method: GET,  path: "/v1/charges*" }
          - allow: { method: POST, path: "/v1/payment_intents" }
          - allow: { method: POST, path: "/v1/refunds" }
        binaries:
          - { path: /sandbox/.venv/bin/python }   # Req 7.2

  internal_cde_services:
    name: "Internal CDE Services"
    endpoints:
      - host: payments-internal.corp.local
        port: 8443
        # Req 1.3: explicit CIDR — NOT open RFC 1918
        allowed_ips: ["10.50.0.0/16"]
        protocol:
          type: Rest
          tls: Auto
          enforcement: Enforce
        access: read-only
        binaries:
          - { path: /sandbox/.venv/bin/python }

  scm_code_only:
    name: "Source Control (code only, no CHD)"
    endpoints:
      - host: github.com
        port: 443
        protocol:
          type: Rest
          tls: Auto
          enforcement: Enforce
        rules:
          - allow: { method: GET,  path: "/*" }
          - allow: { method: POST, path: "/*/git-upload-pack" }
        binaries:
          - { path: /usr/bin/git }

  anthropic_inference:
    name: "Anthropic API (code-generation only)"
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol:
          type: Rest
          tls: Auto
          enforcement: Enforce
        rules:
          - allow: { method: POST, path: "/v1/messages" }
        binaries:
          - { path: /usr/local/bin/claude }

  # Req 1.3.2: default-deny — no fallback rules
