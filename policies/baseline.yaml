# ═══════════════════════════════════════════════════════════════════════════
# ShellForge Policy: Baseline
# ═══════════════════════════════════════════════════════════════════════════
# Compliance regime: None (least-restrictive starting point)
# Use case:         General-purpose AI coding agent sandbox
# Author:           ShellForge Platform Team
# Last reviewed:    2026-05-29
# ═══════════════════════════════════════════════════════════════════════════

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /proc/self
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  package_registries:
    name: "Package Registries"
    endpoints:
      - host: "*.npmjs.com"
        port: 443
        protocol: { type: Rest, tls: Auto, enforcement: Enforce }
        access: read-only
      - host: registry.npmjs.org
        port: 443
        protocol: { type: Rest, tls: Auto, enforcement: Enforce }
        access: read-only
      - host: "*.pypi.org"
        port: 443
        protocol: { type: Rest, tls: Auto, enforcement: Enforce }
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: { type: Rest, tls: Auto, enforcement: Enforce }
        access: read-only

  github:
    name: "GitHub"
    endpoints:
      - host: github.com
        port: 443
        protocol: { type: Rest, tls: Auto, enforcement: Enforce }
        rules:
          - allow: { method: GET,  path: "/*" }
          - allow: { method: POST, path: "/*/git-upload-pack" }
          - allow: { method: POST, path: "/*/git-receive-pack" }
        binaries:
          - { path: /usr/bin/git }
          - { path: /usr/bin/gh }
      - host: "*.githubusercontent.com"
        port: 443
        protocol: { type: Rest, tls: Auto, enforcement: Enforce }
        access: read-only
        binaries:
          - { path: /usr/bin/git }
          - { path: /usr/bin/curl }
          - { path: /usr/bin/wget }

  anthropic_inference:
    name: "Anthropic API"
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: { type: Rest, tls: Auto, enforcement: Enforce }
        rules:
          - allow: { method: POST, path: "/v1/messages" }
        binaries:
          - { path: /usr/local/bin/claude }
          - { path: /sandbox/.venv/bin/python }
