[project]
name = "shellforge-scrubber"
version = "0.1.0"
description = "PII/PHI/PCD scrubbing proxy for HIPAA and PCI-DSS compliance"
requires-python = ">=3.12"

dependencies = [
    # ── Web framework ──────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.2",

    # ── PII detection ──────────────────────────────────────────────────
    # Presidio: orchestration framework for PII analysis + anonymization
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    # spaCy: NLP backbone for Presidio (small model, fast on CPU)
    "spacy>=3.7.0",
    # GLiNER: open-vocabulary NER — plug into Presidio as custom recognizer
    "gliner>=0.2.9",
    # scrubadub: fast regex-based pre-filter
    "scrubadub>=2.0.1",

    # ── Async / streaming ──────────────────────────────────────────────
    "anyio>=4.6.0",
    "sse-starlette>=2.1.3",

    # ── Observability ─────────────────────────────────────────────────
    "structlog>=24.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
